<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis streaming smooth - ChartGPU</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .page {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        max-width: 1100px;
        margin: 0 auto;
      }
      header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      header p {
        margin: 6px 0 0;
        color: #aaa;
        line-height: 1.4;
        font-size: 0.95rem;
      }
      #chart {
        width: 100%;
        min-height: 420px;
        border: 1px solid #222;
        border-radius: 8px;
        background: #111;
      }
      #error {
        display: none;
        color: #f66;
        margin-top: 8px;
      }
      .meta {
        font-size: 0.85rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Axis streaming smooth</h1>
        <p>
          Rising-Y stream with <code>yAxis.autoRange: 'continuous'</code>, grid on, and nice
          1–2–5 majors so ticks and grid roll together as the domain grows. Compare the sticky
          default on other demos.
        </p>
        <div class="meta" id="stats">points: —</div>
      </header>
      <div id="chart"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
